# =============================================================================
# pipeline.yaml  —  Retrieval + reranking + context-assembly knobs
# -----------------------------------------------------------------------------
# Everything DOWNSTREAM of chunking lives here, and it is IDENTICAL across the
# three experiment arms (fixed / semantic / semantic-no-rerank). The only knob
# that ever changes between arms is which chunks are in the index and whether
# rerank is on — so any quality difference is attributable to those, not to a
# retrieval setting that drifted.
#
# Versioning: bump `version` on any change so the run manifest stays honest.
# =============================================================================

version: 1

# -----------------------------------------------------------------------------
# retrieval  —  hybrid search: meaning-based + keyword-based, then fused
# -----------------------------------------------------------------------------
# Dense (vector/cosine) catches paraphrases ("capex" ~ "capital expenditure").
# BM25 (keyword) nails exact tokens ("FY2025", "$391,035"). RRF merges the two
# ranked lists into one robust ranking without tuning score scales.
retrieval:
  dense_top_k: 20             # candidates from Pinecone cosine search
  bm25_top_k: 20             # candidates from BM25 keyword search
  fusion: rrf                 # Reciprocal Rank Fusion
  rrf_k: 60                   # RRF smoothing constant (standard default)
  fused_top_k: 50             # keep top-50 after fusion -> handed to the reranker

  # Restrict search to the relevant company/strategy via vector metadata.
  # `strategy` is set per experiment arm; `company` is set when a query names one.
  metadata_filter:
    enabled: true
    fields: [company, strategy]   # e.g. {strategy: "semantic", company: "verizon"}

# -----------------------------------------------------------------------------
# reranking  —  cross-encoder re-sorts the fused candidates (the measured lift)
# -----------------------------------------------------------------------------
# Model id is in models.yaml. `enabled` is the knob isolated by experiment arm 3.
reranking:
  enabled: true
  input_top_n: 50             # take the fused top-50...
  output_top_n: 5            # ...rerank and keep the best 5 for the LLM

# -----------------------------------------------------------------------------
# context_assembly  —  how the final chunks are arranged into the prompt
# -----------------------------------------------------------------------------
# LLMs attend best to the START and END of context and lose the middle
# ("lost in the middle"). So we place the single best chunk FIRST and the
# second-best LAST, filling the middle with the rest.
context_assembly:
  reorder: lost_in_the_middle     # best-first AND best-last ordering
  question_position: after        # question comes AFTER the context block
  context_open_tag: "<context>"   # structured delimiters around evidence
  context_close_tag: "</context>"
  include_chunk_ids: true         # label each chunk with its id so the LLM can cite it
  max_context_chars: 12000        # hard ceiling on assembled context size

# -----------------------------------------------------------------------------
# vectorstore  —  Pinecone serverless index
# -----------------------------------------------------------------------------
# Index dimension comes from models.yaml embedding.dimension (4096) at creation.
# The fixed vs semantic A/B is isolated by NAMESPACE; company/section live in
# metadata so retrieval can filter to a company across either namespace.
vectorstore:
  index_name: "finrag-10k"
  metric: cosine
  cloud: aws
  region: us-east-1             # Pinecone serverless free-tier region
  namespace_by_strategy: true    # namespace = "fixed" | "semantic"
  upsert_batch_size: 100
